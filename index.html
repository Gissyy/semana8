<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Cotizador de Panadería</title>

		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
	</head>

	<body class="bg-light">
		<main class="container py-4">
			<div class="row justify-content-center">
				<div class="col-12 col-lg-8">
					<div class="card shadow-sm">
						<div class="card-body">
							<h1 class="h3 mb-3">Cotizador de pedidos</h1>

							<p class="text-muted">
								Panadería artesanal Trigal de Lima
							</p>

							<form id="formPedido">
								<!-- DATOS DEL CLIENTE -->
								<h2 class="h5 mt-4">Datos del cliente</h2>

								<div class="mb-3">
									<label for="nombre" class="form-label">
										Nombre
									</label>

									<input
										type="text"
										id="nombre"
										class="form-control"
										minlength="3"
										maxlength="60"
										required
									/>

									<div
										id="errorNombre"
										class="text-danger small"
									></div>
								</div>

								<div class="mb-3">
									<label for="correo" class="form-label">
										Correo
									</label>

									<input
										type="email"
										id="correo"
										class="form-control"
										required
									/>

									<div
										id="errorCorreo"
										class="text-danger small"
									></div>
								</div>

								<div class="mb-3">
									<label for="fecha" class="form-label">
										Fecha de entrega
									</label>

									<input
										type="date"
										id="fecha"
										class="form-control"
										required
									/>

									<div
										id="errorFecha"
										class="text-danger small"
									></div>
								</div>

								<!-- MODALIDAD -->
								<h2 class="h5 mt-4">Modalidad de entrega</h2>

								<div class="mb-3">
									<div class="form-check">
										<input
											class="form-check-input"
											type="radio"
											name="modalidad"
											id="retiro"
											value="retiro"
											checked
										/>

										<label
											class="form-check-label"
											for="retiro"
										>
											Retiro en tienda
										</label>
									</div>

									<div class="form-check">
										<input
											class="form-check-input"
											type="radio"
											name="modalidad"
											id="reparto"
											value="reparto"
										/>

										<label
											class="form-check-label"
											for="reparto"
										>
											Reparto (+ S/ 8.00)
										</label>
									</div>
								</div>

								<!-- PRODUCTOS -->
								<h2 class="h5 mt-4">Productos</h2>

								<p class="text-muted small">
									Seleccione al menos un producto. La cantidad
									permitida es de 1 a 10.
								</p>

								<div id="listaProductos" class="mb-2"></div>

								<div
									id="errorProductos"
									class="text-danger small mb-3"
								></div>

								<!-- RESUMEN -->
								<h2 class="h5 mt-4">Resumen</h2>

								<div class="border rounded p-3 mb-4">
									<div class="d-flex justify-content-between">
										<span>Subtotal:</span>
										<strong>
											S/ <span id="subtotal">0.00</span>
										</strong>
									</div>

									<div class="d-flex justify-content-between">
										<span>Descuento:</span>
										<strong>
											S/ <span id="descuento">0.00</span>
										</strong>
									</div>

									<div class="d-flex justify-content-between">
										<span>Reparto:</span>
										<strong>
											S/
											<span id="costoReparto">0.00</span>
										</strong>
									</div>

									<hr />

									<div class="d-flex justify-content-between">
										<span>Total:</span>
										<strong>
											S/ <span id="total">0.00</span>
										</strong>
									</div>
								</div>

								<button
									type="submit"
									class="btn btn-primary w-100"
								>
									Generar pedido
								</button>
							</form>
						</div>
					</div>
				</div>
			</div>
		</main>

		<script src="js/pedido.js"></script>
	</body>
</html>
