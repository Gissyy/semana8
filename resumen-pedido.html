<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Resumen del pedido</title>

		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
	</head>

	<body class="bg-light">
		<main class="container py-4">
			<div class="row justify-content-center">
				<div class="col-12 col-lg-8">
					<div class="card shadow-sm">
						<div class="card-body">
							<h1 class="h3 mb-4">Resumen del pedido</h1>

							<!-- Se muestra cuando existe pedido -->
							<div id="contenidoPedido">
								<h2 class="h5">Cliente</h2>

								<p>
									<strong>Nombre:</strong>
									<span id="nombre"></span>
								</p>

								<p>
									<strong>Correo:</strong>
									<span id="correo"></span>
								</p>

								<p>
									<strong>Fecha de entrega:</strong>
									<span id="fecha"></span>
								</p>

								<p>
									<strong>Modalidad:</strong>
									<span id="modalidad"></span>
								</p>

								<hr />

								<h2 class="h5">Productos</h2>

								<div class="table-responsive">
									<table class="table">
										<thead>
											<tr>
												<th>Producto</th>
												<th>Cantidad</th>
												<th>Precio</th>
												<th>Importe</th>
											</tr>
										</thead>

										<tbody id="productos"></tbody>
									</table>
								</div>

								<hr />

								<div class="d-flex justify-content-between">
									<span>Subtotal:</span>

									<strong>
										S/ <span id="subtotal"></span>
									</strong>
								</div>

								<div class="d-flex justify-content-between">
									<span>Descuento:</span>

									<strong>
										S/ <span id="descuento"></span>
									</strong>
								</div>

								<div class="d-flex justify-content-between">
									<span>Reparto:</span>

									<strong>
										S/ <span id="reparto"></span>
									</strong>
								</div>

								<hr />

								<div
									class="d-flex justify-content-between fs-5"
								>
									<span>Total:</span>

									<strong>
										S/ <span id="total"></span>
									</strong>
								</div>

								<a
									href="index.html"
									class="btn btn-secondary mt-4"
								>
									Volver
								</a>
							</div>

							<!-- Se muestra si se entra directamente -->
							<div
								id="sinPedido"
								class="alert alert-warning d-none"
							>
								<p>No existe información de un pedido.</p>

								<a href="index.html" class="btn btn-primary">
									Ir al formulario
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>

		<script src="js/resumen.js"></script>
	</body>
</html>
